apiVersion: registry.capelry.dev/v1alpha1
kind: Capability
metadata:
  namespace: capelry
  name: capelry
  version: 2.1.0
  title: Capelry
spec:
  type: skill
  summary: Harness-aware Capelry skill for catalog discovery, validated installation, packaging, and self-update.
  description: Portable Agent Skill integration for Capelry, the AI Agent Capability Registry. It discovers catalog-aware ARD resources, selects verified project or global paths for major coding harnesses, validates Agent Skills frontmatter before transactional installation, and keeps the Capelry skill current from GitHub releases.
  docs:
    readme: SKILL.md
    additional:
      - BOOTSTRAP.md
      - references/harnesses.md
      - ai-catalog.json
  compatibility:
    - target: agents-skills
      versionRange: "*"
      notes: Cross-client project and user convention used by Codex, Pi, OpenCode, Gemini CLI, Cursor, Copilot, Roo Code, Junie, Factory, and OpenHands.
      metadata:
        installPath: .agents/skills/capelry
    - target: claude-code
      versionRange: "*"
      notes: Use .claude/skills/capelry for project scope or ~/.claude/skills/capelry for personal scope. Claude Code does not document .agents/skills discovery.
      metadata:
        installPath: .claude/skills/capelry
    - target: codex-cli
      versionRange: "*"
      notes: Codex documents .agents/skills for repository and user scopes; .codex/skills is not a Codex discovery root.
      metadata:
        installPath: .agents/skills/capelry
    - target: pi
      versionRange: "*"
      notes: Use .pi/skills/capelry or ~/.pi/agent/skills/capelry; Pi also discovers .agents/skills.
      metadata:
        installPath: .pi/skills/capelry
    - target: opencode
      versionRange: "*"
      notes: Use .opencode/skills/capelry or ~/.config/opencode/skills/capelry; OpenCode also discovers .agents and .claude skill roots.
      metadata:
        installPath: .opencode/skills/capelry
    - target: gemini-cli
      versionRange: "*"
      notes: Use .gemini/skills/capelry or ~/.gemini/skills/capelry; Gemini CLI also discovers .agents/skills.
      metadata:
        installPath: .gemini/skills/capelry
    - target: cursor
      versionRange: "*"
      notes: Use .cursor/skills/capelry or ~/.cursor/skills/capelry; Cursor also discovers .agents, .claude, and .codex compatibility roots.
      metadata:
        installPath: .cursor/skills/capelry
    - target: windsurf
      versionRange: "*"
      notes: Use .windsurf/skills/capelry or ~/.codeium/windsurf/skills/capelry for predictable Cascade discovery.
      metadata:
        installPath: .windsurf/skills/capelry
    - target: github-copilot
      versionRange: "*"
      notes: Use .github/skills/capelry for repository scope or ~/.copilot/skills/capelry for personal scope; .agents/skills is also supported.
      metadata:
        installPath: .github/skills/capelry
    - target: cline
      versionRange: "*"
      notes: Use .cline/skills/capelry or ~/.cline/skills/capelry. Cline does not document .agents/skills discovery.
      metadata:
        installPath: .cline/skills/capelry
    - target: roo-code
      versionRange: "*"
      notes: Use .roo/skills/capelry or ~/.roo/skills/capelry; Roo Code also discovers .agents/skills.
      metadata:
        installPath: .roo/skills/capelry
    - target: junie
      versionRange: "*"
      notes: Use .junie/skills/capelry or ~/.junie/skills/capelry; Junie also discovers .agents/skills.
      metadata:
        installPath: .junie/skills/capelry
    - target: kiro
      versionRange: "*"
      notes: Use .kiro/skills/capelry or ~/.kiro/skills/capelry. Custom agents must include the skill through a skill:// resource.
      metadata:
        installPath: .kiro/skills/capelry
    - target: factory
      versionRange: "*"
      notes: Use .factory/skills/capelry or ~/.factory/skills/capelry; Factory also discovers .agents/skills.
      metadata:
        installPath: .factory/skills/capelry
    - target: openhands
      versionRange: "*"
      notes: Use the modern .agents/skills/capelry project or user path.
      metadata:
        installPath: .agents/skills/capelry
  assets:
    - path: BOOTSTRAP.md
      mediaType: text/markdown
      required: true
    - path: references/harnesses.md
      mediaType: text/markdown
      required: true
    - path: ai-catalog.json
      mediaType: application/ai-catalog+json
      required: true
    - path: agents/openai.yaml
      mediaType: text/yaml
      required: false
    - path: scripts/capelry.py
      mediaType: text/x-python
      required: true
    - path: scripts/bootstrap.py
      mediaType: text/x-python
      required: true
  install:
    - target: agents-project
      path: .agents/skills/capelry
      notes: Portable project target for harnesses that document .agents/skills discovery.
      commands:
        - mkdir -p .agents/skills/capelry
        - unzip -oq capelry-2.1.0.zip -d .agents/skills/capelry
    - target: claude-project
      path: .claude/skills/capelry
      notes: Project-local Claude Code install.
    - target: codex-project
      path: .agents/skills/capelry
      notes: Project-local Codex install at its documented repository path.
    - target: pi-project
      path: .pi/skills/capelry
      notes: Project-local Pi install.
    - target: opencode-project
      path: .opencode/skills/capelry
      notes: Project-local OpenCode install.
    - target: gemini-project
      path: .gemini/skills/capelry
      notes: Workspace Gemini CLI install.
    - target: cursor-project
      path: .cursor/skills/capelry
      notes: Project-local Cursor install.
    - target: windsurf-project
      path: .windsurf/skills/capelry
      notes: Workspace Windsurf Cascade install.
    - target: copilot-project
      path: .github/skills/capelry
      notes: Repository GitHub Copilot and VS Code install.
    - target: cline-project
      path: .cline/skills/capelry
      notes: Workspace Cline install.
    - target: roo-project
      path: .roo/skills/capelry
      notes: Project Roo Code install.
    - target: junie-project
      path: .junie/skills/capelry
      notes: Project JetBrains Junie install.
    - target: kiro-project
      path: .kiro/skills/capelry
      notes: Workspace Kiro install.
    - target: factory-project
      path: .factory/skills/capelry
      notes: Project Factory Droid install.
  source:
    repository: https://github.com/capelry-ai/capelry-skills
    path: skills/capelry
    defaultBranch: main
  security:
    permissions:
      - network:read
      - filesystem:write
    sandbox: User-writable skill directories only; inspect third-party instructions and scripts before activation.
